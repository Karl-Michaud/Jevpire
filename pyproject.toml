[project]
name = "jevpire"
version = "0.1.0"
description = "Can Jev call balls and strikes? A research study on decision accuracy, calibration and latency."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "polars>=1.0",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "typer>=0.12",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
video = [
    "opencv-python>=4.10",
]
db = [
    "supabase>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
jevpire = "jevpire.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevpire"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
